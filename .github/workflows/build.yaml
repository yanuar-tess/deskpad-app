name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "DeskPad-$TAG-debug.apk"
      - run: gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
      - run: gh release upload "$TAG" "DeskPad-$TAG-debug.apk" --clobber